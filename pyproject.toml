[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "syn-tui"
version = "1.4.2"
description = "SYN, un reproductor de música local para terminal, optimizado para Kitty"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.0,<9",
    "textual-image>=0.12,<1",
    "mutagen>=1.47",
    "pygame-ce>=2.5",
    "pyfiglet>=1.0",
    "pillow>=10.3",
    "jeepney>=0.9,<1",
]

[project.scripts]
syn = "syn.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["syn"]
