<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18222e"/>
      <stop offset="1" stop-color="#05080b"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8e2ff"/>
      <stop offset="1" stop-color="#2b96ec"/>
    </linearGradient>
  </defs>

  <!-- versión simplificada para 16/24/32 px: sin halo ni borde fino -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <g fill="none" stroke="url(#mark)" stroke-width="150"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 276 L604 512 L300 748"/>
    <path d="M664 748 L804 748"/>
  </g>
</svg>
