<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151e29"/>
      <stop offset="0.55" stop-color="#0d1319"/>
      <stop offset="1" stop-color="#05080b"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.46" r="0.55">
      <stop offset="0" stop-color="#42a5f5" stop-opacity="0.22"/>
      <stop offset="0.65" stop-color="#42a5f5" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#42a5f5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#a8dcff"/>
      <stop offset="0.45" stop-color="#63baff"/>
      <stop offset="1" stop-color="#1e8fe8"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- squircle -->
  <rect x="32" y="32" width="960" height="960" rx="228" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="228" fill="url(#halo)"/>
  <rect x="44" y="44" width="936" height="936" rx="216" fill="none"
        stroke="#2b4c6b" stroke-opacity="0.9" stroke-width="5"/>

  <!-- halo behind the mark -->
  <g filter="url(#soft)" opacity="0.4">
    <path d="M310 312 L536 512 L310 712" fill="none" stroke="#2f9bf0"
          stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M596 712 L744 712" fill="none" stroke="#2f9bf0"
          stroke-width="92" stroke-linecap="round"/>
  </g>

  <!-- terminal prompt ">" + cursor: play + terminal -->
  <g fill="none" stroke="url(#mark)" stroke-width="92"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M310 312 L536 512 L310 712"/>
    <path d="M596 712 L744 712"/>
  </g>
</svg>
